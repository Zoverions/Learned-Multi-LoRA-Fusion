name: Apply Verified LoRA Archive Dependency Candidate Once

on:
  push:
    branches:
      - archive/identity-and-credential-boundary-2026-08
    paths:
      - ".github/workflows/apply-dependency-candidate-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: lora-nexus-verified-dependency-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact archive branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: archive/identity-and-credential-boundary-2026-08
          fetch-depth: 0

      - name: Fetch and verify immutable candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object package.json)" = "03184b0d0e6e33181c54824be684826693612249"
          test "$(git hash-object package-lock.json)" = "27525e46fdcabed58aeebf7529c1fe1fab446839"
          mkdir -p "$RUNNER_TEMP/candidate"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9088036790/zip" \
            > "$RUNNER_TEMP/candidate.zip"
          echo '729439a9df828b39f04399e1b2fb7e98598712de7e78ed8ffbe57a8b066c36fc  '"$RUNNER_TEMP/candidate.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/candidate"
          echo '0e43830b92784a13f750ea8634a0573b2585b0f424efec7197ec1f5f66344c66  '"$RUNNER_TEMP/candidate/package.json" | sha256sum -c -
          echo '0601c131ed5af2360e927032c02a29e3a56fc9e499fda399bcb2e39185d23cc1  '"$RUNNER_TEMP/candidate/package-lock.json" | sha256sum -c -
          test "$(git hash-object "$RUNNER_TEMP/candidate/package.json")" = "4ec6a99397675f204db110c15998be4d9817a050"
          test "$(git hash-object "$RUNNER_TEMP/candidate/package-lock.json")" = "3ae1c7218620fe506f2cdd28a247f9f0b0235e7c"

      - name: Prove direct manifest scope and apply exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.before.json"
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package.before.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/candidate/package.json', 'utf8'));
          const expected = JSON.parse(JSON.stringify(before));
          delete expected.dependencies['@google/genai'];
          if (JSON.stringify(candidate) !== JSON.stringify(expected)) {
            throw new Error('candidate package.json changes beyond removal of unused @google/genai');
          }
          NODE
          cp "$RUNNER_TEMP/candidate/package.json" package.json
          cp "$RUNNER_TEMP/candidate/package-lock.json" package-lock.json
          git rm .github/workflows/dependency-candidate.yml
          git rm .github/workflows/apply-dependency-candidate-once.yml

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            .github/workflows/apply-dependency-candidate-once.yml
            .github/workflows/dependency-candidate.yml
            package-lock.json
            package.json
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected changed paths:\n%s\n' "${changed[@]}"
            exit 1
          fi
          test "$(git hash-object package.json)" = "4ec6a99397675f204db110c15998be4d9817a050"
          test "$(git hash-object package-lock.json)" = "3ae1c7218620fe506f2cdd28a247f9f0b0235e7c"

      - name: Re-verify exact candidate before push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
          test "$(git hash-object package.json)" = "4ec6a99397675f204db110c15998be4d9817a050"
          test "$(git hash-object package-lock.json)" = "3ae1c7218620fe506f2cdd28a247f9f0b0235e7c"

      - name: Commit only the verified dependency transfer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged.txt"
          printf '%s\n' \
            .github/workflows/apply-dependency-candidate-once.yml \
            .github/workflows/dependency-candidate.yml \
            package-lock.json \
            package.json \
            > "$RUNNER_TEMP/expected.txt"
          cmp "$RUNNER_TEMP/staged.txt" "$RUNNER_TEMP/expected.txt"
          git commit -m 'security: remove unused Gemini SDK and repair archive lock'
          git push origin HEAD:archive/identity-and-credential-boundary-2026-08
